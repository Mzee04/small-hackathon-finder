name: Update hackathon list

on:
  schedule:
    # Twice a day. GitHub may start a scheduled run a few hours late.
    - cron: "0 6 * * *" # 06:00 UTC
    - cron: "0 18 * * *" # 18:00 UTC
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # needed to push updated docs/ files

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install --quiet -r requirements-dev.txt
          python -m pytest tests/ -q

      - name: Fetch and rank hackathons
        run: python hackathons.py

      - name: Commit and push updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to docs/ - nothing to commit."
          else
            git commit -m "Update hackathon data for $(date -u +%Y-%m-%d)"
            git push
          fi
